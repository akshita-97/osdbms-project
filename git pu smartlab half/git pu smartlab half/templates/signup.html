{% extends "auth_base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
  <h1 class="auth-title">Create an account</h1>
  <form method="POST" action="{{ url_for('auth.signup') }}">
    <div class="auth-field"><label for="full_name">Full name (optional)</label>
      <input id="full_name" name="full_name" value="{{ form.full_name }}" autocomplete="name" maxlength="100">
    </div>
    <div class="auth-field"><label for="username">Username</label>
      <input id="username" name="username" value="{{ form.username }}" autocomplete="username"
             minlength="3" maxlength="30" pattern="[A-Za-z0-9_.\-]+" required autofocus>
      <span class="muted">3-30 characters: letters, numbers, . - _</span>
    </div>
    <div class="auth-field"><label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="new-password" minlength="8" required>
      <span class="muted">At least 8 characters.</span>
    </div>
    <div class="auth-field"><label for="confirm_password">Confirm password</label>
      <input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
    </div>
    <button type="submit" class="auth-submit">Sign up</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
